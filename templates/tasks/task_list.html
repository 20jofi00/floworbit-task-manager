{% extends "base.html" %}
{% block title %}<title>Tasks</title>{% endblock %}

{% block content %}
  <h1 class="mb-2">Tasks</h1>
  <p class="text-secondary text-break mb-4">{{ team.name }}</p>

  {% include "includes/task_filter_form.html" %}

  {% include "includes/task_table.html" with tasks=task_list empty_message="No tasks found." %}

  <a
    href="{% url 'teams:team-detail' pk=team.id %}"
    class="btn btn-outline-secondary"
  >
    Back to team
  </a>
{% endblock %}
