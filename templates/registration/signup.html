{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block title %}<title>Sign up</title>{% endblock %}

{% block content %}
  <div class="col-12 col-md-8 col-lg-6 col-xl-5 mx-auto">
    <p class="text-primary fw-bold fs-4 mb-4">FlowOrbit</p>

    <h1 class="mb-2">Create account</h1>
    <p class="text-secondary mb-4">
      Get started with FlowOrbit.
    </p>

    <form
      method="post"
      action="{% url 'accounts:signup' %}"
      class="bg-white border rounded p-4 mb-4"
      novalidate
    >
      {% csrf_token %}
      {{ form|crispy }}

      <button type="submit" class="btn btn-primary w-100">
        Sign up
      </button>
    </form>

    <p class="text-center text-secondary">
      Already have an account?
      <a href="{% url 'login' %}" class="text-decoration-none">
        Log in
      </a>
    </p>
  </div>
{% endblock %}
