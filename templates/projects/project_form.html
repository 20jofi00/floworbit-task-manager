{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block title %}<title>Project form</title>{% endblock %}

{% block content %}
  <h1 class="mb-4">{{ object|yesno:"Edit,Create" }} project</h1>

  <form method="post" class="bg-white border rounded p-4" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit" class="btn btn-primary">
      Save
    </button>

    {% if object %}
      <a
        href="{% url 'projects:project-detail' team_pk=object.team.id pk=object.id %}"
        class="btn btn-outline-secondary"
      >
        Cancel
      </a>
    {% else %}
      <a
        href="{% url 'projects:project-list' team_pk=form.instance.team_id %}"
        class="btn btn-outline-secondary"
      >
        Cancel
      </a>
    {% endif %}
  </form>
{% endblock %}
