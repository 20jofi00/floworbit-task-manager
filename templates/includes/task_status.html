{% if task.state == "blocked" %}
  <span class="badge bg-danger-subtle text-danger-emphasis border border-danger-subtle rounded-pill">Blocked</span>
{% elif task.state == "completed" %}
  <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle rounded-pill">Completed</span>
{% elif task.state == "in_progress" %}
  <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill">In progress</span>
{% else %}
  <span class="badge bg-white text-secondary border rounded-pill">Unassigned</span>
{% endif %}
